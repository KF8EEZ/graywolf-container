# Overlay that builds the image locally from the Containerfile instead of
# pulling the published one. The graywolf version comes from the ARG default in
# the Containerfile. Use with compose.yaml:
#
#   podman compose -f compose.yaml -f compose.build.yaml up -d --build
#
# Add -f compose.digirig.yaml as well for a Digirig.
services:
  graywolf:
    image: localhost/graywolf:local
    build:
      context: .
      dockerfile: Containerfile
